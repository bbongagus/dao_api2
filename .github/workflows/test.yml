name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The journal test and every test that reaches src/redis.js connect to
      # localhost:6379.
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The property authentication exists for, checked against a running
      # server: nobody reaches a graph that is not their own.
      - name: Live authentication and isolation test
        run: |
          npm run auth:dev-keys
          PORT=3099 node --env-file=.env src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3099/health > /dev/null && break; sleep 1; done
          node --env-file=.env test-auth-isolation.js http://localhost:3099
      - name: Server log
        if: failure()
        run: cat server.log
